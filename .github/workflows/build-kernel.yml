name: Build Kernel with GCC

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl device-tree-compiler flex \
            git libelf-dev libssl-dev lz4 make python3 rsync unzip zip zstd \
            libncurses-dev gcc-aarch64-linux-gnu

      - name: Checkout Kernel Source
        run: |
          git clone --depth=1 https://github.com/sm4450-development/android_kernel_common.git kernel_source

      - name: Set Environment Variables
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "CC=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "LD=aarch64-linux-gnu-ld" >> $GITHUB_ENV
          echo "AR=aarch64-linux-gnu-ar" >> $GITHUB_ENV
          echo "LLVM=0" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV

      - name: Generate Defconfig
        run: |
          cd kernel_source
          make O=$GITHUB_WORKSPACE/out gki_defconfig

      - name: Build Kernel
        run: |
          cd kernel_source
          make O=$GITHUB_WORKSPACE/out -j$(nproc)

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Sky-Image
          path: ${{ github.workspace }}/out/arch/arm64/boot/Image
          if-no-files-found: error
      - name: Generate Defconfig
        run: |
          cd /tmp/sm4450/common
          make O=$GITHUB_WORKSPACE/out gki_defconfig

      - name: Build Kernel
        run: |
          cd /tmp/sm4450/common
          make O=$GITHUB_WORKSPACE/out -j$(nproc)

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Sky-Image
          path: ${{ github.workspace }}/out/arch/arm64/boot/Image
          if-no-files-found: error

name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      WORKSPACE: ${{ github.workspace }}/kernel_workspace
      CONFIG_ENV: config.env
    steps:
      - uses: actions/checkout@v4

      - name: Resolve configuration
        run: bash scripts/config.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl device-tree-compiler flex \
            git libelf-dev libssl-dev lz4 make python3 rsync unzip zip zstd \
            libncurses-dev
          mkdir -p "$WORKSPACE"

      - name: Set up toolchain
        run: bash scripts/toolchain.sh

      - name: Fetch kernel source
        run: bash scripts/source.sh

      # 修复：拉取驱动，删除所有报错的文件夹
      - name: Fix mihw and config for Sky
        run: |
          cd kernel_workspace/android-kernel
          git clone --depth=1 https://github.com/loogeo/Android_Xiaomi_Kernel_for_shennong.git /tmp/shennong
          cp -r /tmp/shennong/drivers/mihw drivers/

          rm -rf drivers/mihw/mi_sched
          rm -rf drivers/mihw/turbo_sched

          sed -i '/#include <linux\/device.h>/a #include <linux\/devfreq.h>' drivers/scsi/mi_ufs/mi-ufshcd.h

          rm -f drivers/misc/mi-memory/mi_ufs_info.c
          sed -i '/mi_ufs_info/d' drivers/misc/mi-memory/Makefile

          rm -rf drivers/misc/ktd3136_bl
          sed -i '/ktd3136_bl/d' drivers/misc/Kconfig
          sed -i '/ktd3136_bl/d' drivers/misc/Makefile

          rm -rf drivers/misc/ocp2131_bias
          sed -i '/ocp2131_bias/d' drivers/misc/Kconfig
          sed -i '/ocp2131_bias/d' drivers/misc/Makefile

          echo 'obj-$(CONFIG_MIHW)         += mihw/' >> drivers/Makefile
          echo 'source "drivers/mihw/Kconfig"' >> drivers/Kconfig

          echo "CONFIG_MIHW=y" >> arch/arm64/configs/vendor/sky_consolidate_defconfig
          echo "CONFIG_PM_DEVFREQ=y" >> arch/arm64/configs/vendor/sky_consolidate_defconfig
          echo "CONFIG_DEVFREQ_GOV_SIMPLE_ONDEMAND=y" >> arch/arm64/configs/vendor/sky_consolidate_defconfig
          cd ../..

      - name: Build kernel
        run: |
          sed -i 's/-j$(nproc)/-j4/g' scripts/build.sh
          bash scripts/build.sh all

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Sky-Image
          path: kernel_workspace/android-kernel/out/arch/arm64/boot/Image.gz
          if-no-files-found: error

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-Sky
          path: kernel_workspace/AnyKernel3/*
          if-no-files-found: error

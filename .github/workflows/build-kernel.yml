name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      WORKSPACE: ${{ github.workspace }}/kernel_workspace
      CONFIG_ENV: config.env
    steps:
      - uses: actions/checkout@v4

      - name: Resolve configuration
        run: bash scripts/config.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl device-tree-compiler flex \
            git libelf-dev libssl-dev lz4 make python3 rsync unzip zip zstd \
            libncurses-dev
          mkdir -p "$WORKSPACE"

      - name: Set up toolchain
        run: bash scripts/toolchain.sh

      - name: Fetch kernel source
        run: bash scripts/source.sh

      # ================= 核心修复步骤（云端自动补全 mihw） =================
      - name: Fix mihw and config for Sky
        run: |
          cd kernel_workspace/android-kernel
          echo ">>> 正在从 shennong 仓库拉取缺失的 mihw 驱动..."
          git clone --depth=1 https://github.com/loogeo/Android_Xiaomi_Kernel_for_shennong.git /tmp/shennong
          
          echo ">>> 正在复制 mihw 目录..."
          cp -r /tmp/shennong/drivers/mihw drivers/

          echo ">>> 正在修改顶层 Kconfig 和 Makefile..."
          echo 'obj-$(CONFIG_MIHW)         += mihw/' >> drivers/Makefile
          echo 'source "drivers/mihw/Kconfig"' >> drivers/Kconfig

          echo ">>> 正在修改 defconfig 开启必要配置..."
          echo "CONFIG_MIHW=y" >> arch/arm64/configs/vendor/sky_consolidate_defconfig
          echo "CONFIG_SCHED_WALT=y" >> arch/arm64/configs/vendor/sky_consolidate_defconfig
          echo "CONFIG_DEVFREQ_GOV_SIMPLE_ONDEMAND=y" >> arch/arm64/configs/vendor/sky_consolidate_defconfig
          cd ../..
      # ===================================================================

      - name: Build kernel
        run: |
          bash scripts/build.sh all

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Sky-Image
          path: kernel_workspace/android-kernel/out/arch/arm64/boot/Image.gz
          if-no-files-found: error

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-Sky
          path: kernel_workspace/AnyKernel3/*
          if-no-files-found: error
